include:
  # Stage 1 (bring-up): each half as an independent USB keyboard, no split, no BLE.
  - board: nice_nano//zmk
    shield: dactyl4x6lh
    cmake-args: -DCONFIG_ZMK_BLE=n
  - board: nice_nano//zmk
    shield: dactyl4x6rh
    cmake-args: -DCONFIG_ZMK_BLE=n
  # Stages 2-3 (bring-up): same independent halves, now over Bluetooth (no split).
  - board: nice_nano//zmk
    shield: dactyl4x6lh
    artifact-name: dactyl4x6lh_ble
  - board: nice_nano//zmk
    shield: dactyl4x6rh
    artifact-name: dactyl4x6rh_ble
  # Stage 4 (split).
  - board: nice_nano//zmk
    shield: dactyl_left
  - board: nice_nano//zmk
    shield: dactyl_right
  # Stage 4 diagnostics: same split halves with USB serial logging enabled.
  - board: nice_nano//zmk
    shield: dactyl_left
    snippet: zmk-usb-logging
    artifact-name: dactyl_left_log
  - board: nice_nano//zmk
    shield: dactyl_right
    snippet: zmk-usb-logging
    artifact-name: dactyl_right_log
  # Flash on a half to wipe its bonds, then flash the real firmware again.
  - board: nice_nano//zmk
    shield: settings_reset
