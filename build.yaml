include:
  # Stage 1 (bring-up): each half as an independent USB keyboard, no split, no BLE.
  - board: nice_nano//zmk
    shield: dactyl_left_solo
    cmake-args: -DCONFIG_ZMK_BLE=n
  - board: nice_nano//zmk
    shield: dactyl_right_solo
    cmake-args: -DCONFIG_ZMK_BLE=n
  # Stage 2+ (wireless / split).
  - board: nice_nano//zmk
    shield: dactyl_left
  - board: nice_nano//zmk
    shield: dactyl_right
  # Flash on a half to wipe its bonds, then flash the real firmware again.
  - board: nice_nano//zmk
    shield: settings_reset
