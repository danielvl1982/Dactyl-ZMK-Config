# Applies to both halves (shared file, no _left/_right suffix).

# Low-frequency clock from the internal RC oscillator instead of the 32.768 kHz
# crystal. The split link between the two halves timed out (reason 0x08) as soon
# as it went idle, which points at an inaccurate crystal on these clone boards.
# RC declares 500 ppm, so both sides widen their receive windows accordingly.
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_500PPM=y

# Deep sleep after ZMK_IDLE_SLEEP_TIMEOUT of inactivity (set to 5 min, default is 15).
# Any key press wakes the half (kscan0 is a wakeup-source).
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=300000

# Battery level over BLE: each half reports its own, the central (left) fetches
# the peripheral's level and proxies both to the host.
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# Windows workaround: without it the battery level may not show up in Settings.
CONFIG_BT_GATT_ENFORCE_SUBSCRIPTION=n
